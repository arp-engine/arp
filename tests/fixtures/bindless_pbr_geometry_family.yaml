type: BindlessShaderVariant
contractVersion: 1
name: PbrGeometryFamily
vectorRecordContractVersion: 1
set: 1
maxBindings: 20
maxSwitchCases: 23
snapshotBytes: 160
snapshotMetadataBinding: 0
faultLatchBinding: 1
tables:
- name: MaterialImages
  tableId: 1
  kind: SampledTexture
  capacity: 10
  binding: 2
  stages:
  - fragment
  operations:
  - sampleGrad
  sampler: MaterialSamplers
- name: MaterialSamplers
  tableId: 2
  kind: Sampler
  capacity: 2
  binding: 12
  stages:
  - fragment
  operations: []
- name: MaterialRecords
  tableId: 3
  kind: ReadOnlyStorageBuffer
  capacity: 1
  binding: 14
  stages:
  - fragment
  operations:
  - load
  record:
    fields:
    - name: baseColorAlpha
      type: float4
    - name: factors
      type: float4
    - name: coverageLeaf
      type: float4
    - name: textures
      type: uint4
    - name: routing
      type: uint4
    - name: generation
      type: uint4
- name: MaterialResults
  tableId: 4
  kind: StorageBuffer
  capacity: 1
  binding: 15
  stages:
  - fragment
  operations:
  - store
  - query
pipelineInterfaceContractVersion: 1
pushConstants:
  contractVersion: 1
  sizeBytes: 16
  stages:
  - vertex
  webGpuGroup: 3
  webGpuBinding: 0

initializedGraphics:
  contractVersion: 2
  prototypeOptIn: true
  interfaces:
  - identity: 1
    vertexEntries: [meshColorVertex, skinColorVertex, grassColorVertex, canopyColorVertex]
    fragmentEntries: [familyColorMain]
  - identity: 2
    vertexEntries: [meshDepthVertex, skinDepthVertex, grassDepthVertex, canopyDepthVertex]
    fragmentEntries: [familyDepthMain]
  - identity: 3
    vertexEntries: [meshShadowVertex, skinShadowVertex, grassShadowVertex, canopyShadowVertex]
    fragmentEntries: [familyShadowMain]
