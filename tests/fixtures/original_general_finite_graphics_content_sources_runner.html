<!doctype html>
<meta charset="utf-8">
<title>Original finite Graphics initialized content sources</title>
<script src="progress-contract.js"></script>
<script src="browser_progress_transport.js"></script>
<script>
var messages=[], errors=[], reported=false;
var transport=new BrowserProgressTransport(messages,BrowserProgressLimits,
  batch=>fetch('/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(batch)}),
  error=>{errors.push(String(error));finish(false);});
function finish(completed) {
  if(reported)return;reported=true;
  const parameters=new URLSearchParams(location.search);
  const bufferType=parameters.get('general-content-buffer-type')||'uniform';
  const whole=parameters.has('general-source-whole');
  const sourceCount=messages.filter(m=>m.startsWith('BINDLESS_RHI_GENERAL_SOURCE5_OK ')).length;
  const associationCount=messages.filter(m=>m==='BINDLESS_RHI_GENERAL_GRAPHICS_CONTENT_SOURCE5_ASSOCIATION_OK original-RenderPipeline8-set9 Fragment-sampled4 completed-upload-root-custody stale-initial-refused alias-owner-refused attachment-uninitialized hot0-query0 native-draw-closed').length;
  const initializerCompleted=messages.includes('BINDLESS_RHI_GENERAL_SAMPLED_INITIALIZER_OK same-device upload20 mips2 original-scopes-drained recorded-submit-completed committed-root');
  const contentSourcesCreated=messages.includes('BINDLESS_RHI_GENERAL_GRAPHICS_CONTENT_SOURCES_CREATED_OK sampled-upload20-mips2-completed attachment-ContentCreation2-RGBA16F8-cell1-uninitialized original-independent-quotas exact-less-exhausted source-owners no-mixed-root');
  const contentSourceTerminal=messages.includes('BINDLESS_RHI_GENERAL_GRAPHICS_CONTENT_SOURCE5_TERMINAL_OK descriptor-reset-refused sampled-completed-unchanged attachment-uninitialized no-publication');
  const contentSourcesRetired=messages.includes('BINDLESS_RHI_GENERAL_GRAPHICS_CONTENT_SOURCES_RETIRE_OK original-upload-scopes-callbacks-content-domains-quotas-zero attachment-never-completed no-root-draw-output');
  const graphicsSourcePassed=messages.includes(`BINDLESS_RHI_GENERAL_GRAPHICS_SOURCE5_COMPOSITION_OK ${bufferType} ${whole?'whole':'static-dynamic'} accepted-RenderPipeline Fragment4 real-GeneralWrite2 frozen-Source5 original-terminal quotas-zero draw-readback-closed`);
  const originalSourceRetirementPassed=messages.includes(`BINDLESS_RHI_GENERAL_SOURCE5_RETIRE_OK ${whole?'whole':'static-dynamic'} caller-drop weak-inventory terminal-invalid all-quotas-zero execution-public-closed`);
  const graphicsInputRetirementPassed=messages.includes('BINDLESS_RHI_GENERAL_GRAPHICS_SOURCE5_INPUT_RETIRE_OK original-module-child-custody artifact-input-quotas-zero draw-readback-unvalidated');
  const nativeErrors=Module.webGpuUncapturedErrors||[];
  const nativeGroupCreateCount=Module.webGpuNativeGroupCreateCount||0;
  const success=completed && initializerCompleted && contentSourcesCreated && contentSourceTerminal && contentSourcesRetired
    && graphicsSourcePassed && originalSourceRetirementPassed && graphicsInputRetirementPassed
    && sourceCount===(whole?1:2) && associationCount===sourceCount && nativeGroupCreateCount>0 && !errors.length && !nativeErrors.length;
  transport.flush().catch(error=>errors.push(String(error))).then(()=>fetch('/result',{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      success:success && !errors.length && !nativeErrors.length,scenario:'original-general-finite-graphics-content-sources',
      bufferType,rangeKind:whole?'whole':'static-dynamic',sourceCount,associationCount,initializerCompleted,
      contentSourcesCreated,contentSourceTerminal,contentSourcesRetired,graphicsSourcePassed,
      originalSourceRetirementPassed,graphicsInputRetirementPassed,nativeGroupCreateCount,nativeErrors,errors,messages,
      mixedGraphicsRootValidated:false,finiteGraphicsValidated:false,nativeDrawReadbackValidated:false,
      fullFiniteExecutionValidated:false,finiteLifecycle4Validated:false,publicExecutionAvailable:false,
      nativeSyncPromoted:false,platformValidated:false,productionReady:false
    })}));
}
window.addEventListener('error',event=>{errors.push(String(event.error||event.message));finish(false);});
window.addEventListener('unhandledrejection',event=>{errors.push(String(event.reason));finish(false);});
var Module={
  print(value){const message=String(value);transport.append(message);
    if(message==='BINDLESS_RHI_GENERAL_ORIGINAL_PROJECTION_SCENARIO_OK private-submission-numerical-unproven-public-closed')finish(true);},
  printErr(value){errors.push(String(value));finish(false);},onAbort(value){errors.push(String(value));finish(false);},
  onExit(code){if(code!==0){errors.push('EXIT '+code);finish(false);}}
};
</script>
<script src="graphics_source.js"></script>
