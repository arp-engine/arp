<script>

  batch => fetch('/progress', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(batch)}), error => { errors.push(String(error)); finish(false); });
function finish(completed) {

  const renderInputsCount = messages.filter(message => message.startsWith('BINDLESS_RHI_GENERAL_GRAPHICS_INPUTS6_RENDERUSAGE4_OK ')).length;
  const graphics = messages.includes('BINDLESS_RHI_GENERAL_GRAPHICS_SOURCE5_COMPOSITION_OK '

  const retired = messages.includes('BINDLESS_RHI_GENERAL_GRAPHICS_SOURCE5_INPUT_RETIRE_OK original-module-child-custody artifact-input-quotas-zero draw-readback-unvalidated');
  const terminal = messages.includes('BINDLESS_RHI_GENERAL_GRAPHICS_RENDERUSAGE4_TERMINAL_OK original-inputs-retained invalid-no-output native-draw-closed');
  const attachmentRetired = messages.includes('BINDLESS_RHI_GENERAL_GRAPHICS_RENDER_PROJECTION_RETIRE_OK original-attachment graph-quotas-zero no-native-record-submit');
  const sourceRetired = messages.includes('BINDLESS_RHI_GENERAL_SOURCE5_RETIRE_OK '

    && groups > 0 && !errors.length && !nativeErrors.length;

    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({
      success: success && !errors.length && !nativeErrors.length, scenario: 'original-general-finite-graphics-render-projection',
      bufferType, rangeKind: whole ? 'whole' : 'static-dynamic', sourceCount, renderInputsCount,
      graphicsSourcePassed: graphics, graphicsInputRetirementPassed: retired,
      renderTerminalPassed: terminal, attachmentRetirementPassed: attachmentRetired,
      originalSourceRetirementPassed: sourceRetired, nativeGroupCreateCount: groups, nativeErrors, errors, messages,
      finiteGraphicsValidated: false, nativeDrawReadbackValidated: false,

      publicExecutionAvailable: false, nativeSyncPromoted: false, platformValidated: false, productionReady: false

window.addEventListener('error', event => { errors.push(String(event.error || event.message)); finish(false); });

var Module = {
  print(value) {

  printErr(value) { errors.push(String(value)); finish(false); },
