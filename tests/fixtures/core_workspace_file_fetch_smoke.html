<!doctype html>
<meta charset="utf-8">
<title>ARP workspace FileService contract</title>
<script>
'use strict';
window.arpWorkspaceOrigin = new URLSearchParams(location.search).get('origin');
const messages = [];
let reported = false;
window.arpWorkspaceReport = result => {
    if (reported) return;
    reported = true;
    fetch('/result', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({...result, messages})});
};
window.addEventListener('error', e => window.arpWorkspaceReport({success: false, error: String(e.message)}));
window.addEventListener('unhandledrejection', e => window.arpWorkspaceReport({success: false, error: String(e.reason)}));
var Module = {
    print: text => { if (messages.length < 128) messages.push(String(text).slice(0, 2048)); },
    printErr: text => { if (messages.length < 128) messages.push(String(text).slice(0, 2048)); },
    onAbort: error => window.arpWorkspaceReport({success: false, error: String(error)})
};
</script>
<script src="arp_core_workspace_file_fetch_smoke.js"></script>
