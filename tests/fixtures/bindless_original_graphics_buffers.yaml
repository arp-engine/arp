    tableId: 2
    kind: ReadOnlyStorageBuffer
    capacity: 2
    binding: 2
    stages: [vertex, fragment]
    operations: [load, query]
  - name: Counters
    tableId: 3
    kind: StorageBuffer
    capacity: 2
    binding: 4
    stages: [fragment]
    operations: [load, query, store, atomicAdd]
