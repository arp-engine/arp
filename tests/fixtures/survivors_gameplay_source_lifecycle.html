<!doctype html><meta charset="utf-8"><title>Survivors gameplay text lifecycle</title>
<script>
var gameplayRoot=new URL('survivors-gameplay-fixture/payload/',location.href).href;
var Module={arguments:[gameplayRoot],gameplayRequests:{},
    onAbort:reason=>fetch('/result',{method:'POST',body:JSON.stringify({success:false,error:String(reason)})})};
const originalFetch=globalThis.fetch;
globalThis.fetch=function(input,...options){
    const url=typeof input==='string'?input:input.url;
    if(url && url.startsWith(gameplayRoot)){
        const path=url.slice(gameplayRoot.length);
        Module.gameplayRequests[path]=(Module.gameplayRequests[path]||0)+1;
    }
    return originalFetch.call(this,input,...options);
};
</script><script src="arp_survivors_gameplay_source_lifecycle.js"></script>
