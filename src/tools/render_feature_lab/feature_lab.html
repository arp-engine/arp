<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>ARP Render Feature Lab</title>
  <style>html,body,canvas{margin:0;width:100%;height:100%;display:block;background:#111}</style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <script>
    // The visual fixture takes its screenshot after the native entry point
    // returns. Keep the configured WebGPU surface alive until page teardown so
    // that browser compositing can consume the submitted current texture.
    window.__arpRenderFeatureLabKeepCanvasAlive = true;

    // Chromium rejects resizable WebAssembly memory views in crypto APIs.
    // Keep Emscripten's random source semantics while passing a fixed view.
    (function () {
      if (!window.crypto || !window.crypto.getRandomValues) return;
      var nativeGetRandomValues = window.crypto.getRandomValues.bind(window.crypto);
      window.crypto.getRandomValues = function (view) {
        var fixed = new Uint8Array(view.byteLength);
        nativeGetRandomValues(fixed);
        view.set(fixed);
        return view;
      };
    }());
    window.addEventListener('error', function (event) {
      document.body.dataset.renderFeatureLabError = event.message || 'script-error';
    });
    window.addEventListener('unhandledrejection', function (event) {
      document.body.dataset.renderFeatureLabRejection = String(event.reason || 'promise-rejection');
    });
    var Module = {
      canvas: document.getElementById('canvas'),
      print: function (value) {
        var text = String(value);
        // Keep the final JSON report stable even when late asynchronous RHI
        // diagnostics arrive after main() has printed it. Plain diagnostics
        // are still captured in the console, but are not the machine report.
        if (text.trim().charAt(0) === '{') {
          document.body.dataset.renderFeatureLabOutput = text;
        }
        console.log('[render-feature-lab]', value);
      },
      printErr: function (value) {
        document.body.dataset.renderFeatureLabError = String(value);
        console.error('[render-feature-lab]', value);
      },
      onAbort: function (value) { console.error('[render-feature-lab] abort', value); }
    };

    // emdawnwebgpu does not implement wgpuSurfacePresent.  A configured
    // canvas surface is composited by the browser on animation-frame ticks,
    // so keep the fixture's page alive long enough for the submitted surface
    // texture to reach the browser compositor.
    (function keepCanvasCompositorAlive() {
      function tick() { window.requestAnimationFrame(tick); }
      window.requestAnimationFrame(tick);
    }());
  </script>
  <script src="arp_render_feature_lab.js"></script>
</body>
</html>
